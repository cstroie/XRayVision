# XRayVision Configuration File
# This file contains all configurable parameters for XRayVision
# If this file is missing, the application will use default values

[general]
# Database and backup paths
XRAYVISION_DB_PATH = xrayvision-multi.db
XRAYVISION_BACKUP_DIR = backup
# Maximum number of backup files to keep (oldest deleted when exceeded)
BACKUP_MAX_FILES = 30

[users]
# User definitions with roles
# Format: username = password,role
# Roles: admin, user
admin = admin,admin
#user1 = password1,user
#user2 = password2,user

[dicom]
# DICOM server configuration
AE_TITLE = XRAYVISION
AE_PORT = 4010
REMOTE_AE_TITLE = DICOM_SERVER
REMOTE_AE_IP = 192.168.1.1
REMOTE_AE_PORT = 104
RETRIEVAL_METHOD = C-MOVE
# Comma-separated list of DICOM modalities to query and accept (e.g. CR,DX)
DICOM_MODALITIES = CR,DX

[openai]
# OpenAI API configuration
OPENAI_URL_PRIMARY = http://127.0.0.1:8080/v1/chat/completions
OPENAI_URL_SECONDARY = http://127.0.0.1:11434/v1/chat/completions
OPENAI_API_KEY = sk-your-api-key
MODEL_NAME = medgemma-4b-it

[dashboard]
# Dashboard configuration
DASHBOARD_PORT = 8000

[notifications]
# Notification configuration
NTFY_URL = https://ntfy.sh/xrayvision-alerts
# Public base URL of this server for image attachments in ntfy notifications
# Leave empty to send notifications without an image attachment
# Example: NTFY_IMAGE_BASE_URL = https://xrayvision.example.com
NTFY_IMAGE_BASE_URL =

[fhir]
# FHIR API configuration for HIS integration
FHIR_URL = http://127.0.0.1:44660
FHIR_USERNAME = hipocrate
FHIR_PASSWORD = hipocrate

[processing]
# Processing configuration
PAGE_SIZE = 10
KEEP_DICOM = False
LOAD_DICOM = False
NO_QUERY = False
ENABLE_NTFY = False
ENABLE_HIS = True
QUERY_INTERVAL = 300
SEVERITY_THRESHOLD = 5

[regions]
# Anatomic region identification rules
# Format: region_name = keyword1, keyword2, keyword3, ...
chest = torace, pulmon, thorax, chest
ribs = grilaj, coaste, ribs
sternum = stern
abdomen = abdomen, abdominal
occipital = occiput, occipital, occipit
skull = cap, craniu, skull
mandible = mandibula, mandible
nose = nazal, piramida
sinuses = sinus
spine = col., spine, dens, sacrat
pelvis = bazin, pelvis
clavicle = clavicula, clavicl
upper_limb = humerus, antebrat, forearm
hand = pumn, mana, deget, hand, finger, wrist
shoulder = umar, shoulder
elbow = cot, elbow
hip = sold, hip
lower_limb = femur, tibie, gamba, leg
knee = genunchi, patella, knee
ankle = glezna, ankle
foot = picior, calcai, calcaneu, foot

[questions]
# Region-specific questions for AI analysis
# Format: region_name = question_text
chest = Are there any lung consolidations, infitrates, opacities, pleural effusion, pneumothorax or pneumoperitoneum
ribs = Are there any ribs or clavicles fractures
sternum = Are there any fractures
abdomen = Are there any signs of bowel obstruction, pneumoperitoneum or foreign bodies
occipital = Are there any fractures of the occipital bone
skull = Are there any fractures
mandible = Are there any fractures
nose = Are there any fractures of nasal bones
sinuses = Are the paranasal sinuses normally aerated or are they opaque or are there fluid levels
spine = Are there any fractures or dislocations
pelvis = Are there any fractures
clavicle = Are there any fractures
upper_limb = Are there any fractures, dislocations or bone tumors
hand = Are there any fractures, dislocations or bone tumors
shoulder = Are there any fractures or dislocations
elbow = Are there any fractures or dislocations
hip = Are there any fractures or dislocations
lower_limb = Are there any fractures, dislocations or bone tumors
knee = Are there any fractures or dislocations
ankle = Are there any fractures or dislocations
foot = Are there any fractures or dislocations

[templates]
# Region-specific reporting checklists injected into each AI prompt as "ASSESS IN ORDER"
# Format: region_name = item1 | item2 | item3 ...
# Use | as delimiter (items may contain commas). Omit a region to use no checklist.
chest = Lung parenchyma (consolidations, infiltrates, nodules, hyperinflation) | Pleura (effusion, pneumothorax, thickening) | Mediastinum (width, contour, trachea midline) | Cardiac silhouette (size, contour) | Hila (enlargement, prominence) | Diaphragm (elevation, flattening, free air below) | Costophrenic angles (blunting) | Bones (fractures, lytic or sclerotic lesions) | Soft tissues
abdomen = Bowel gas pattern (obstruction, ileus, distribution) | Free intraperitoneal air (subdiaphragmatic) | Soft tissue masses or organomegaly | Calcifications (biliary, renal, vascular, appendicolith) | Bones (fractures, degenerative changes) | Soft tissues and psoas shadows
nose = Nasal bones (fracture, displacement, angulation) | Nasal septum (deviation, dislocation) | Soft tissue swelling | Adjacent facial bones
sinuses = Maxillary sinuses (opacification, air-fluid levels, mucosal thickening) | Frontal sinuses (opacification, development) | Ethmoid sinuses | Sphenoid sinus | Ostiomeatal complex | Bony walls (erosion, thickening)
clavicle = Clavicle shaft (fracture, displacement, angulation) | Acromioclavicular joint (separation, dislocation) | Sternoclavicular joint | Adjacent soft tissues
ribs = Rib cortices (fractures, number and location) | Pleura (pneumothorax, effusion) | Underlying lung | Soft tissues
spine = Vertebral alignment and curvature | Vertebral body height and end plates (compression, wedging) | Pedicles (integrity) | Disc spaces (narrowing) | Neural foramina | Paraspinal soft tissues
pelvis = Pelvic ring (fractures, disruption, symmetry) | Acetabula (fractures, depth) | Hip joints (dislocation, joint space) | Sacrum and coccyx | Sacroiliac joints | Pubic symphysis | Soft tissues
occipital = Occipital bone (fractures, linear, depressed, or comminuted) | Foramen magnum region | Adjacent posterior fossa | Upper cervical spine (C1-C2 alignment) | Soft tissue swelling
skull = Calvarium (fractures, thinning, density changes) | Sutures (diastasis, premature fusion) | Sella turcica | Paranasal sinuses | Orbits and facial bones
shoulder = Glenohumeral joint (dislocation, joint space, Hill-Sachs) | Acromion (morphology, acromioclavicular joint) | Humeral head (fractures, avascular necrosis) | Coracoid process | Soft tissues and rotator cuff calcifications
elbow = Distal humerus (fractures, epicondyles) | Olecranon and coronoid process | Radial head (fractures, dislocation) | Joint alignment (anterior fat pad, posterior fat pad sign) | Joint space | Soft tissues
hip = Femoral neck and head (fractures, avascular necrosis) | Acetabulum (depth, fractures) | Joint space (narrowing, effusion) | Greater and lesser trochanters | Soft tissues
knee = Distal femur and proximal tibia (fractures, Segond fracture) | Patella (fracture, position) | Joint space (narrowing, effusion, Lipohaemarthrosis) | Fibular head | Soft tissues
ankle = Distal tibia and fibula (fractures, malleoli) | Mortise symmetry | Talus (fractures, osteochondral lesions) | Calcaneus (Bohler angle) | Soft tissues and joint space
foot = All tarsal and metatarsal bones | Toes | Sesamoids | Lisfranc joint alignment | Calcaneus | Soft tissues
hand = All carpals and metacarpals | Phalanges | Joint alignment and spaces | Soft tissues
upper_limb = Humerus | Radius and ulna | Elbow and wrist joints | Soft tissues
lower_limb = Femur | Tibia and fibula | Knee and ankle joints | Soft tissues

[region_fhir_map]
# Maps internal region names to HIS/FHIR region names for service request lookup.
# Use when an internal sub-region does not exist as a separate entity in the HIS.
# If a region is not listed here, its internal name is used as-is.
occipital = skull

[supported_regions]
# List of regions to process (one per line)
# Only exams matching these regions will be processed
# Keys must match the region names defined in [regions] above
chest = true
abdomen = true
nose = true
sinuses = true
clavicle = true
occipital = true
